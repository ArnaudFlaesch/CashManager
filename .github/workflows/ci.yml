name: Node.js CI

on: ["push", "workflow_dispatch"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of SonarCloud analysis

      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          npm run eslint
          npm run lint:styles
          npm run lint:styles:report

      - name: Build
        run: |
          npm run build -- --base-href=https://arnaudflaesch.github.io/CashManager/
          cp dist/CashManager/browser/index.html dist/CashManager/browser/404.html

      - name: Test
        id: application-tests
        run: npm run test:coverage

      - name: Login to Github Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Start database image
        run: |
          docker run -p 5432:5432 -d -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=dash postgres:18.6-alpine3.24

      - name: Start backend image
        run: |
          [[ "$(git ls-remote --heads https://github.com/ArnaudFlaesch/Dash-WebServices ${{github.ref_name}} | wc -l)" == 1 && ${{github.ref_name}} != 'main' ]] && tagName=${{github.ref_name}} || tagName=latest
          docker run -d --network="host" -e POSTGRES_PASSWORD=postgres ghcr.io/arnaudflaesch/dash-webservices:$tagName

      - name: E2E Tests
        uses: cypress-io/github-action@18016a55674bd02cabf197de5762a1710cb5577c # v7.4.9
        id: e2e-tests
        with:
          browser: chrome
          config-file: cypress-test.config.ts
          start: npm start
          wait-on: "http://localhost:4200"

      - name: Generate test report
        id: generate-e2e-report
        if: always() && steps.e2e-tests.outcome == 'failure'
        run: |
          mkdir cypress/screenshots || true
          npm run report:merge
          npm run report:generate
          npm run report:copyScreenshots

      - name: Upload Cypress report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.generate-e2e-report.outcome == 'success'
        with:
          name: Cypress report
          path: cypress/reports/html

      - name: Report coverage for Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always() && steps.application-tests.outcome == 'success'
        with:
          directory: coverage/CashManager
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Report coverage for Codacy
        if: always() && steps.application-tests.outcome == 'success'
        run: |
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r coverage/CashManager/lcov.info
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        if: always() && steps.application-tests.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: success() && github.ref_name == 'main'
        with:
          path: ./dist/CashManager/browser

  deploy:
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: test
    if: success() && github.ref_name == 'main'

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  codacy-security-scan:
    permissions:
      contents: read
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Execute Codacy Analysis CLI and generate a SARIF output with the security issues identified during the analysis
      - name: Run Codacy Analysis CLI
        run: |
          curl -Ls https://raw.githubusercontent.com/codacy/codacy-cli-v2/main/codacy-cli.sh -o codacy-cli
          chmod +x codacy-cli
          ./codacy-cli init --project-token ${{ secrets.CODACY_PROJECT_TOKEN }} --provider gh --organization ArnaudFlaesch --repository CashManager
          ./codacy-cli config discover .
          ./codacy-cli install
          ./codacy-cli analyze --format sarif -o results.sarif
          ./codacy-cli upload -s results.sarif -c ${{ github.sha }} -t ${{ secrets.CODACY_PROJECT_TOKEN }}
