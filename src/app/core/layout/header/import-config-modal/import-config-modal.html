<h1 mat-dialog-title>{{ labels.title }}</h1>
<mat-dialog-content>
  <input
    type="file"
    id="file"
    name="file"
    [attr.aria-label]="labels.selectFile"
    #fileInput
    (change)="selectFile(fileInput)"
  />
</mat-dialog-content>
<mat-dialog-actions>
  <button type="button" mat-button id="close-import-config-modal" mat-dialog-close>{{ labels.cancel }}</button>
  <button type="button" mat-flat-button id="upload-file-button" [disabled]="!fileToUpload()" (click)="upload()">
    {{ labels.import }}
  </button>
</mat-dialog-actions>
