<div id="login-page">
  <div id="login-card" class="stack">
    <a routerLink="/home" id="login-logo">
      <img src="assets/logo.png" alt="cash manager logo" class="app-logo" />
    </a>
    <h1 id="login-page-title">CashManager</h1>
    <p id="login-page-subtitle">Suivez et analysez vos dépenses</p>

    <form id="login-form" class="stack" [formRoot]="loginForm">
      <mat-form-field appearance="outline">
        <mat-label>Nom d'utilisateur</mat-label>
        <mat-icon matPrefix>person</mat-icon>
        <input
          matInput
          id="input-username"
          autocomplete="username"
          aria-label="Username"
          [formField]="loginForm.username"
        />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Mot de passe</mat-label>
        <mat-icon matPrefix>lock</mat-icon>
        <input
          matInput
          id="input-password"
          autocomplete="current-password"
          aria-label="Password"
          [formField]="loginForm.password"
          [type]="isPasswordVisible() ? 'text' : 'password'"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="isPasswordVisible.set(!isPasswordVisible())"
          [attr.aria-label]="isPasswordVisible() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
        >
          <mat-icon>{{ isPasswordVisible() ? "visibility_off" : "visibility" }}</mat-icon>
        </button>
      </mat-form-field>

      <button
        mat-flat-button
        id="login-button"
        type="submit"
        [disabled]="loginForm().invalid() || loginForm().submitting()"
      >
        <span class="row">
          @if (loginForm().submitting()) {
            <mat-spinner diameter="20" />
          }
          <span>Se connecter</span>
        </span>
      </button>
    </form>
  </div>
</div>
