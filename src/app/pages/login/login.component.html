<div id="login-page">
  <div id="login-container">
    <a routerLink="/home" id="logo-container">
      <img src="assets/logo.png" id="cash-manager-logo" alt="cash manager logo" />
    </a>
    <h1 id="login-page-title">CashManager</h1>
    <form id="login-form" [formRoot]="loginForm">
      <input id="inputUsername" placeholder="Username" aria-label="Username" [formField]="loginForm.username" />

      <input
        id="inputPassword"
        placeholder="Password"
        aria-label="Password"
        [formField]="loginForm.password"
        type="password"
      />

      <button
        mat-raised-button
        id="loginButton"
        type="submit"
        [disabled]="loginForm().invalid() || loginForm().submitting()"
        color="primary"
      >
        <span id="login-button-label">
          @if (loginForm().submitting()) {
            <mat-spinner diameter="30" />
          }
          <span>Se connecter</span>
        </span>
      </button>
    </form>
  </div>
</div>
