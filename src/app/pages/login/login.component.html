<div class="login-page">
  <div class="login-card stack">
    <a routerLink="/home" class="logo">
      <img src="assets/logo.png" alt="cash manager logo" />
    </a>
    <h1 id="login-page-title" class="title">CashManager</h1>
    <form class="login-form stack" [formRoot]="loginForm">
      <input id="inputUsername" placeholder="Username" aria-label="Username" [formField]="loginForm.username" />

      <input
        id="inputPassword"
        placeholder="Password"
        aria-label="Password"
        [formField]="loginForm.password"
        type="password"
      />

      <button
        mat-raised-button
        id="loginButton"
        type="submit"
        [disabled]="loginForm().invalid() || loginForm().submitting()"
        color="primary"
      >
        <span class="row">
          @if (loginForm().submitting()) {
            <mat-spinner diameter="30" />
          }
          <span>Se connecter</span>
        </span>
      </button>
    </form>
  </div>
</div>
