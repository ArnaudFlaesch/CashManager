<div id="login-page">
  <div id="login-container">
    <a routerLink href="/home" id="logo-container">
      <img src="assets/logo.png" id="cash-manager-logo" alt="cash manager logo" />
    </a>
    <div>
      <h1 id="login-page-title">CashManager</h1>
    </div>
    <div id="login-form">
      <input id="inputUsername" placeholder="Username" aria-label="Username" [formField]="loginForm.username" />

      <input id="inputPassword" placeholder="Password" aria-label="Password" [formField]="loginForm.password" type="password" />

      <button
        mat-raised-button
        id="loginButton"
        [disabled]="!loginModel().username || !loginModel().password || isLoading()"
        (click)="handleLogin()"
        color="primary"
      >
        <span id="login-button-label">
          @if (isLoading()) {
            <mat-spinner diameter="30"></mat-spinner>
          }
          <span>Se connecter</span>
        </span>
      </button>
    </div>
  </div>
</div>
