<div>
  <button (click)="selectPreviousMonth()" mat-icon-button>
    <mat-icon>arrow_back</mat-icon>
  </button>
  <mat-form-field appearance="fill">
    <mat-label>Sélectionnez un mois</mat-label>
    <input matInput [matDatepicker]="picker" [formField]="selectedMonthForm.selectedMonth" />
    <mat-datepicker-toggle matIconSuffix [for]="picker" />
    <mat-datepicker
      #picker
      startView="multi-year"
      (monthSelected)="setMonthAndYear($event, picker)"
      [startAt]="selectedMonthModel().selectedMonth"
    />
  </mat-form-field>

  <button (click)="selectNextMonth()" mat-icon-button>
    <mat-icon>arrow_forward</mat-icon>
  </button>
</div>

<div id="expenses-container">
  <div id="chart-container">
    <canvas baseChart [data]="expensesByLabelChart()" [options]="chartOptions" type="bar"></canvas>
  </div>

  <div id="expenses-detail">
    <h3 id="expenses-total">Total ce mois : {{ totalForMonth() }}€</h3>
    @if (expenses.value().length) {
      <div id="expenses-list">
        @for (expense of expenses.value(); track expense.id) {
          <div>
            <span>
              {{ expense.expenseDate | date: "dd/MM" }} : {{ expense.amount }}€
              {{ labelNames().get(expense.labelId) }}
            </span>
            @if (false) {
              <button mat-icon-button (click)="openDeleteExpenseModal(expense.id)">
                <mat-icon>delete</mat-icon>
              </button>
            }
          </div>
        }
      </div>
    }
  </div>
</div>

<app-create-expense (insertedExpenseEvent)="handleExpenseCreation($event)" [labels]="labels()" />
