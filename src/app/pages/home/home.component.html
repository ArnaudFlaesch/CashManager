<cash-manager-header class="page-header" />

<mat-tab-group>
  <mat-tab label="Affichage des dépenses par mois">
    <cash-manager-expense-list-by-month [labels]="labels.value()" />
  </mat-tab>
  <mat-tab label="Affichage du total par mois">
    <cash-manager-total-expense-by-month [labels]="labels.value()" />
  </mat-tab>
  <mat-tab label="Affichage de la liste des labels">
    <form class="create-label-form row" [formRoot]="labelForm">
      <mat-form-field appearance="fill">
        <mat-label>Étiquette</mat-label>
        <input
          type="text"
          id="label-form"
          placeholder="Renseignez un label"
          aria-label="Label"
          matInput
          [formField]="labelForm.label"
        />
      </mat-form-field>

      <button id="create-label-button" type="submit" mat-raised-button [disabled]="labelForm().submitting()">
        Ajouter une étiquette
      </button>
    </form>

    <cash-manager-label-list [labels]="labels.value()" (labelDeleted)="onDeleteLabel($event)" />
  </mat-tab>
</mat-tab-group>
