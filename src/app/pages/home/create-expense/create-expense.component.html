<form class="expense-form row" [formRoot]="expenseForm">
  <mat-form-field appearance="fill" id="expenseAmount-container">
    <mat-label>Montant</mat-label>
    <input
      id="expenseAmount"
      type="number"
      step=".01"
      matInput
      [formField]="expenseForm.amount"
      placeholder="Saisissez le montant de la dépense"
      aria-label="Montant"
    />
  </mat-form-field>

  <mat-form-field appearance="fill" id="expenseDate-container">
    <mat-label>Date</mat-label>
    <input
      [formField]="expenseForm.date"
      matInput
      id="expenseDate"
      [matDatepicker]="picker"
      placeholder="Sélectionnez une date"
      aria-label="Date"
      readonly
    />
    <mat-hint>DD/MM/YYYY</mat-hint>
    <mat-datepicker-toggle matSuffix [for]="picker" />
    <mat-datepicker #picker />
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Étiquette</mat-label>
    <input
      type="text"
      id="expense-label"
      placeholder="Renseignez un label"
      aria-label="Label"
      matInput
      [formField]="expenseForm.label"
      [matAutocomplete]="auto"
    />

    <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayLabel">
      @for (option of filteredOptions(); track option.id) {
        <mat-option class="label-autocomplete-option" [value]="option">
          {{ option.label }}
        </mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>

  <button
    id="add-expense-button"
    class="submit-button"
    type="submit"
    [disabled]="!canCreateExpense()"
    mat-raised-button
  >
    Ajouter une dépense
  </button>
</form>
