<div class="row">
  <mat-form-field>
    <mat-label>Étiquettes</mat-label>
    <mat-select [formField]="labelForm.labelId">
      @for (label of labels(); track label.id) {
        <mat-option [value]="label.id">{{ label.label }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
  @if (isOneLabelSelected()) {
    <button mat-icon-button (click)="resetSelectedLabel()"><mat-icon>close</mat-icon></button>
  }
</div>

<div class="chart-container">
  <canvas baseChart [data]="totalExpensesByMonthChart()" [options]="chartOptions" type="line"></canvas>
</div>
