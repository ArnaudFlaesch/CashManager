<h1 mat-dialog-title>{{ data.title }}</h1>
<mat-dialog-content>
  {{ data.message }}
</mat-dialog-content>
<mat-dialog-actions>
  <button type="button" mat-button id="cancel-action" mat-dialog-close>{{ labels.cancel }}</button>
  <button type="button" mat-flat-button id="validate-action" mat-dialog-close="validate">{{ labels.validate }}</button>
</mat-dialog-actions>
