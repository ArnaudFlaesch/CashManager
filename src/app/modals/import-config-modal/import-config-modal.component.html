<h1 mat-dialog-title>Importer la configuration</h1>
<mat-dialog-content>
  <input
    type="file"
    id="file"
    name="file"
    aria-label="Sélectionner un fichier de configuration"
    #fileInput
    (change)="selectFile(fileInput)"
  />
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button id="closeImportConfigModal" mat-dialog-close>Annuler</button>
  <button mat-flat-button id="uploadFileButton" [disabled]="!fileToUpload()" (click)="upload()">Importer</button>
</mat-dialog-actions>
