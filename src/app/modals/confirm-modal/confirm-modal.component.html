<h1 mat-dialog-title>{{ data.title }}</h1>
<mat-dialog-content>
  {{ data.message }}
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button id="cancel-action" mat-dialog-close>Annuler</button>
  <button mat-flat-button id="validate-action" [mat-dialog-close]="'validate'">Valider</button>
</mat-dialog-actions>
