<cash-manager-header />

<main id="page-content">
  <mat-tab-group id="home-tabs" mat-stretch-tabs="false" mat-align-tabs="start" animationDuration="200ms">
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">receipt_long</mat-icon>
        <span class="tab-label">{{ labels.monthExpenses }}</span>
      </ng-template>
      <div class="tab-content">
        <cash-manager-expense-list-by-month [expenseLabels]="expenseLabels.value()" />
      </div>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">show_chart</mat-icon>
        <span class="tab-label">{{ labels.totalByMonth }}</span>
      </ng-template>
      <div class="tab-content">
        <cash-manager-total-expense-by-month [expenseLabels]="expenseLabels.value()" />
      </div>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">sell</mat-icon>
        <span class="tab-label">{{ labels.expenseLabels }}</span>
      </ng-template>
      <section class="tab-content card">
        <h2 class="card-title">
          <mat-icon>sell</mat-icon>
          {{ labels.expenseLabels }}
        </h2>

        <form id="create-label-form" class="row" [formRoot]="labelForm">
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-label>{{ labels.newLabel }}</mat-label>
            <input
              type="text"
              id="label-form"
              [placeholder]="labels.labelPlaceholder"
              [attr.aria-label]="labels.labelAriaLabel"
              matInput
              [formField]="labelForm.label"
            />
          </mat-form-field>

          <button id="create-label-button" type="submit" mat-flat-button [disabled]="labelForm().submitting()">
            <mat-icon>add</mat-icon>
            {{ labels.add }}
          </button>
        </form>

        <cash-manager-label-list [expenseLabels]="expenseLabels.value()" (labelDeleted)="removeLabel($event)" />
      </section>
    </mat-tab>
  </mat-tab-group>
</main>
