<form id="expense-form" [formRoot]="expenseForm">
  <mat-form-field appearance="outline" id="expense-amount-container">
    <mat-label>{{ labels.amount }}</mat-label>
    <mat-icon matPrefix>euro</mat-icon>
    <input
      id="expense-amount"
      type="number"
      step=".01"
      matInput
      [formField]="expenseForm.amount"
      [placeholder]="labels.amountPlaceholder"
      [attr.aria-label]="labels.amount"
    />
  </mat-form-field>

  <mat-form-field appearance="outline" id="expense-date-container">
    <mat-label>{{ labels.date }}</mat-label>
    <input
      [formField]="expenseForm.date"
      matInput
      id="expense-date"
      [matDatepicker]="picker"
      [placeholder]="labels.datePlaceholder"
      [attr.aria-label]="labels.date"
      readonly
    />
    <mat-hint>{{ labels.dateHint }}</mat-hint>
    <mat-datepicker-toggle matSuffix [for]="picker" />
    <mat-datepicker #picker />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>{{ labels.label }}</mat-label>
    <input
      type="text"
      id="expense-label"
      [placeholder]="labels.labelPlaceholder"
      [attr.aria-label]="labels.labelAriaLabel"
      matInput
      [formField]="expenseForm.label"
      [matAutocomplete]="auto"
    />

    <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayLabel">
      @for (option of filteredOptions(); track option.id) {
        <mat-option class="label-autocomplete-option" [value]="option">
          {{ option.label }}
        </mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>

  <button id="add-expense-button" type="submit" [disabled]="!canCreateExpense()" mat-flat-button>
    <mat-icon>add</mat-icon>
    {{ labels.add }}
  </button>
</form>
