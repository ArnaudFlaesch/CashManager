<cash-manager-expense-list-by-month-view
  [expenses]="expenses.value()"
  [expenseLabels]="expenseLabels()"
  [isDarkMode]="isDarkMode()"
  [(selectedMonth)]="selectedMonth"
  (expenseDeletionRequested)="openDeleteExpenseModal($event)"
/>

<section class="card">
  <h2 class="card-title">
    <mat-icon>add_card</mat-icon>
    {{ labels.newExpense }}
  </h2>
  <cash-manager-create-expense
    [expenseLabels]="expenseLabels()"
    [isSubmitting]="isCreatingExpense()"
    (expenseSubmitted)="addExpense($event)"
  />
</section>
