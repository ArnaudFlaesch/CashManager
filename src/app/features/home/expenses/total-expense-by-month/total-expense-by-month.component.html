<section class="card">
  <div id="total-header" class="row">
    <h2 id="total-title" class="card-title">
      <mat-icon>show_chart</mat-icon>
      {{ labels.title }}
    </h2>

    <div id="label-filter" class="row">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>{{ labels.expenseLabels }}</mat-label>
        <mat-select [formField]="labelForm.labelId">
          @for (label of expenseLabels(); track label.id) {
            <mat-option [value]="label.id">{{ label.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      @if (isOneLabelSelected()) {
        <button mat-icon-button [matTooltip]="labels.allLabels" (click)="resetSelectedLabel()">
          <mat-icon>close</mat-icon>
        </button>
      }
    </div>
  </div>

  <div class="chart-container">
    <canvas baseChart [data]="totalExpensesByMonthChart()" [options]="chartOptions()" type="line"></canvas>
  </div>
</section>
