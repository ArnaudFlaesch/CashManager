<div id="label-list" class="grid">
  @for (label of expenseLabels(); track label.id) {
    <div class="label-container">
      <mat-icon class="label-icon accent-text">sell</mat-icon>
      <span class="label-name ellipsis">{{ label.label }}</span>
      <button
        type="button"
        mat-icon-button
        class="delete-label-button"
        [matTooltip]="labels.deleteLabel"
        (click)="openDeleteLabelDialog(label.id)"
      >
        <mat-icon>delete_outline</mat-icon>
      </button>
    </div>
  } @empty {
    <div id="no-label-message" class="empty-state">
      <mat-icon>sell</mat-icon>
      <span>{{ labels.noLabel }}</span>
    </div>
  }
</div>
