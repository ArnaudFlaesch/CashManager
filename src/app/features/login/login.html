<div id="login-page" class="centered-page">
  <div id="login-card" class="stack">
    <a routerLink="/home" id="login-logo">
      <img ngSrc="assets/logo.png" width="128" height="128" priority [alt]="labels.logoAlt" class="app-logo" />
    </a>
    <h1 id="login-page-title">{{ labels.title }}</h1>
    <p id="login-page-subtitle" class="muted-text">{{ labels.subtitle }}</p>

    <form id="login-form" class="stack" [formRoot]="loginForm">
      <mat-form-field appearance="outline">
        <mat-label>{{ labels.usernameLabel }}</mat-label>
        <mat-icon matPrefix>person</mat-icon>
        <input
          matInput
          id="input-username"
          autocomplete="username"
          [attr.aria-label]="labels.username"
          [formField]="loginForm.username"
        />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>{{ labels.passwordLabel }}</mat-label>
        <mat-icon matPrefix>lock</mat-icon>
        <input
          matInput
          id="input-password"
          autocomplete="current-password"
          [attr.aria-label]="labels.password"
          [formField]="loginForm.password"
          [type]="isPasswordVisible() ? 'text' : 'password'"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="isPasswordVisible.set(!isPasswordVisible())"
          [attr.aria-label]="isPasswordVisible() ? labels.hidePassword : labels.showPassword"
        >
          <mat-icon>{{ isPasswordVisible() ? "visibility_off" : "visibility" }}</mat-icon>
        </button>
      </mat-form-field>

      <button
        mat-flat-button
        id="login-button"
        type="submit"
        [disabled]="loginForm().invalid() || loginForm().submitting()"
      >
        <span class="row">
          @if (loginForm().submitting()) {
            <mat-spinner diameter="20" />
          }
          <span>{{ labels.login }}</span>
        </span>
      </button>
    </form>
  </div>
</div>
