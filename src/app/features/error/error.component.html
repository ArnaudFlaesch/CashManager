<div id="error-page" class="centered-page">
  <div id="error-card" class="card empty-state">
    <mat-icon>error_outline</mat-icon>
    <h1>{{ labels.title }}</h1>
    <p>{{ labels.message }}</p>
    <a mat-flat-button routerLink="/home">
      <mat-icon>home</mat-icon>
      {{ labels.backToHome }}
    </a>
  </div>
</div>
