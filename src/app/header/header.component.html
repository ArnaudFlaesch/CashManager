<div class="actions row">
  <button mat-mini-fab matTooltip="Applications" [matMenuTriggerFor]="appsMenu" color="primary">
    <mat-icon>apps</mat-icon>
  </button>
  @if (canUserSeeNotifications()) {
    <cash-manager-notifications />
  }

  <button
    id="cashmanager-menu"
    matTooltip="Menu utilisateur"
    mat-mini-fab
    [matMenuTriggerFor]="cashManagerMenu"
    color="primary"
  >
    <mat-icon>account_circle</mat-icon>
  </button>

  <mat-menu #appsMenu="matMenu">
    <a mat-menu-item [href]="dashApplicationUrl">
      <mat-icon>dashboard</mat-icon>
      <span>Dash</span>
    </a>
  </mat-menu>

  <mat-menu #cashManagerMenu="matMenu">
    <div mat-menu-item>
      <div class="row">
        <mat-icon>light_mode</mat-icon>
        <mat-slide-toggle [checked]="isDarkMode()" (change)="toggleTheme($event.checked)" />
        <mat-icon>dark_mode</mat-icon>
      </div>
    </div>
    <mat-divider />
    <button mat-menu-item (click)="downloadConfig()" id="downloadConfigButton">
      <mat-icon>download</mat-icon>
      <span>Télécharger la configuration</span>
    </button>
    <button mat-menu-item (click)="openImportConfigModal()" id="openImportConfigModal">
      <mat-icon>upload</mat-icon>
      <span>Importer une configuration</span>
    </button>
    <mat-divider />
    <button mat-menu-item (click)="logout()" id="logoutButton">
      <mat-icon>logout</mat-icon>
      <span>Déconnexion</span>
    </button>
  </mat-menu>
</div>
